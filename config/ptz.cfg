# =====================================================================
#  PTZ mount configuration  (Klipper-like syntax)
#  Board : BigTreeTech SKR Pico v1.0 (RP2040) + Raspberry Pi 4 over UART
#
#  Pin syntax (same as Klipper):
#     gpio11      plain pin
#     !gpio12     inverted
#     ^gpio4      pull-up enabled (inputs only)
#     ^!gpio4     pull-up + inverted
#
#  Axes are declared with [axis <name>]. Order of declaration = MCU axis
#  slot (0..3). Names pan / tilt / zoom / focus are understood by the
#  web UI, VISCA and joystick mappings.
#
#  Units: whatever rotation_distance is expressed in. Here degrees of the
#  OUTPUT shaft for pan/tilt, degrees of the lens ring for zoom.
#  Velocities are units/s, accelerations units/s^2.
# =====================================================================

[mcu]
# Raspberry Pi PL011 UART (see docs/raspberry-pi-setup.md)
serial: /dev/serial0
baud: 500000
# How often the MCU reports positions (Hz)
status_rate: 50
# MCU stops every jogging axis if no command arrives within this delay (s)
watchdog_timeout: 0.3

[server]
http_host: 0.0.0.0
http_port: 8080
# Low latency JSON-over-UDP control port (0 = disabled)
udp_port: 9000
# VISCA over IP (Sony protocol used by PTZ joysticks, OBS, vMix,
# Bitfocus Companion...). Standard port 52381, 0 = disabled.
visca_port: 52381
# Rate at which status is pushed to WebSocket/UDP subscribers (Hz)
status_rate: 20
# Where presets and other runtime state are stored
state_dir: ~/.ptz

[motion]
# Global jog shaping, applied to normalized joystick inputs (-1..1)
deadband: 0.04
# 0 = linear, 1 = fully cubic. Gives fine control near center.
expo: 0.5
# A jog source must refresh its command at least this often (s)
jog_timeout: 0.5
# Energize motors at startup (tilt needs holding torque!)
enable_on_start: True
# Home these axes automatically at startup (comma separated, empty = none)
home_on_start:

[tmc_uart]
# Shared single-wire UART bus of the 4 TMC2209 on the SKR Pico
uart_pin: gpio9
tx_pin: gpio8
baud: 115200

# ---------------------------------------------------------------- PAN (X)
[axis pan]
step_pin: gpio11
dir_pin: gpio10
enable_pin: !gpio12
endstop_pin: ^gpio4
microsteps: 16
full_steps_per_rotation: 200
# Motor pulley : output gear, Klipper syntax ("80:16" = 5:1 reduction)
gear_ratio: 80:16
rotation_distance: 360
position_min: -170
position_max: 170
position_endstop: -175
homing_positive_dir: False
homing_speed: 20
second_homing_speed: 4
homing_retract_dist: 5
# Position to move to once homed (optional)
park_position: 0
max_velocity: 90
max_accel: 180
# Jog speed when the joystick is fully deflected
jog_velocity: 60
jog_accel: 120

[tmc2209 pan]
uart_address: 0
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.110
interpolate: True
# Klipper semantics: 0 = spreadCycle only, very high = stealthChop always
stealthchop_threshold: 999999

# ---------------------------------------------------------------- TILT (Y)
[axis tilt]
step_pin: gpio6
dir_pin: gpio5
enable_pin: !gpio7
endstop_pin: ^gpio3
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 80:16
rotation_distance: 360
position_min: -45
position_max: 90
position_endstop: -50
homing_positive_dir: False
homing_speed: 15
second_homing_speed: 3
homing_retract_dist: 5
park_position: 0
max_velocity: 60
max_accel: 120
jog_velocity: 40
jog_accel: 90

[tmc2209 tilt]
uart_address: 2
run_current: 0.9
hold_current: 0.7
sense_resistor: 0.110
interpolate: True
stealthchop_threshold: 999999

# ---------------------------------------------------------------- ZOOM (Z)
[axis zoom]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
endstop_pin: ^gpio25
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 1:1
# degrees of the zoom ring per motor gear revolution (ring/pinion teeth)
rotation_distance: 360
position_min: 0
position_max: 90
position_endstop: 0
homing_positive_dir: False
homing_speed: 30
second_homing_speed: 5
homing_retract_dist: 3
max_velocity: 120
max_accel: 400
jog_velocity: 60
jog_accel: 300

[tmc2209 zoom]
uart_address: 1
run_current: 0.5
hold_current: 0.3
sense_resistor: 0.110
interpolate: True
stealthchop_threshold: 999999

# ---------------------------------------------------------------- FOCUS (E) - optional

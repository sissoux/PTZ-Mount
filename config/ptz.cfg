# =====================================================================
#  PTZ mount configuration  (Klipper-like syntax)
#  Board : BigTreeTech SKR Pico v1.0 (RP2040) + Raspberry Pi 4 over UART
#
#  Pin syntax (same as Klipper):
#     gpio11      plain pin
#     !gpio12     inverted
#     ^gpio4      pull-up enabled (inputs only)
#     ^!gpio4     pull-up + inverted
#
#  Axes are declared with [axis <name>]. Order of declaration = MCU axis
#  slot (0..3). Names pan / tilt / zoom / focus are understood by the
#  web UI, VISCA and joystick mappings.
#
#  Units: whatever rotation_distance is expressed in. Here degrees of the
#  OUTPUT shaft for pan/tilt, degrees of the lens ring for zoom.
#  Velocities are units/s, accelerations units/s^2.
#
#  Mechanics, pins, polarities and currents are taken from the original
#  Klipper setup (config/PreviousConfig.cfg): [stepper_x] = pan,
#  [stepper_y] = tilt, [stepper_z] = zoom, [extruder] = focus.
# =====================================================================

[mcu]
# Raspberry Pi PL011 UART (see docs/raspberry-pi-setup.md)
serial: /dev/ttyAMA0
baud: 500000
# How often the MCU reports positions (Hz)
status_rate: 50
# MCU stops every jogging axis if no command arrives within this delay (s)
watchdog_timeout: 0.3

[server]
http_host: 0.0.0.0
http_port: 8080
# Low latency JSON-over-UDP control port (0 = disabled)
udp_port: 9000
# VISCA over IP (Sony protocol used by PTZ joysticks, OBS, vMix,
# Bitfocus Companion...). Standard port 52381, 0 = disabled.
visca_port: 52381
# Rate at which status is pushed to WebSocket/UDP subscribers (Hz)
status_rate: 20
# Where presets and other runtime state are stored
state_dir: ~/.ptz

[motion]
# Global jog shaping, applied to normalized joystick inputs (-1..1)
deadband: 0.04
# 0 = linear, 1 = fully cubic. Gives fine control near center.
expo: 0.5
# A jog source must refresh its command at least this often (s)
jog_timeout: 0.5
# Energize motors at startup (tilt needs holding torque!)
enable_on_start: True
# Home these axes automatically at startup (comma separated, empty = none)
home_on_start:
# --- motion shaping (computed on the Pi, streamed to the board) ---
# Default ease in/out: 0 = sharp starts and stops, 1 = softest.
smoothing: 0.3
# Duration of the acceleration ramp when smoothing is at 1 (s)
ease_time: 0.6
# Rate of the velocity stream sent to the board (Hz)
stream_rate: 100

[tmc_uart]
# Shared single-wire UART bus of the 4 TMC2209 on the SKR Pico
uart_pin: gpio9
tx_pin: gpio8
baud: 115200

# ---------------------------------------------------------------- PAN (X)
[axis pan]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
endstop_pin: ^!gpio4
microsteps: 16
full_steps_per_rotation: 400
# Motor pulley : output gear, Klipper syntax
gear_ratio: 144:17
rotation_distance: 360
position_min: -180
position_max: 180
# Switch sits inside the travel range: the endstop guard is then off
# automatically (endstop_guard: auto) and homing backs off until released.
position_endstop: -96
homing_positive_dir: False
homing_speed: 20
second_homing_speed: 5
homing_retract_dist: 5
# Position to move to once homed (optional)
#park_position: 0
# Klipper [printer] limits, a safe starting point. Firmware ceiling for this
# gearing is ~132 deg/s (20 kHz step rate).
max_velocity: 45
max_accel: 50
# Default speed and acceleration for jog and moves (web UI sliders, in
# units/s and units/s^2; always capped by max_velocity / max_accel)
jog_velocity: 30
jog_accel: 50
# Unit label shown in the web UI (deg = °)
units: deg
# Include this axis in "Home all" and in homing without an explicit axis list
home_with_all: True

[tmc2209 pan]
uart_address: 0
run_current: 1.4
hold_current: 0.5
sense_resistor: 0.110
interpolate: True
# Klipper semantics: 0 = spreadCycle only, very high = stealthChop always
stealthchop_threshold: 999999

# ---------------------------------------------------------------- TILT (Y)
[axis tilt]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
endstop_pin: ^!gpio3
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 64:21
rotation_distance: 360
position_min: -90
position_max: 32
position_endstop: -78
homing_positive_dir: False
homing_speed: 20
second_homing_speed: 5
homing_retract_dist: 5
max_velocity: 45
max_accel: 50
jog_velocity: 30
jog_accel: 50
home_with_all: True

[tmc2209 tilt]
uart_address: 2
run_current: 1.4
hold_current: 0.5
sense_resistor: 0.110
interpolate: True
stealthchop_threshold: 999999

# ---------------------------------------------------------------- ZOOM (Z)
# The zoom drive is not always fitted:
#   home_with_all: False -> skipped by "Home all" / home_on_start, but can
#                           still be jogged and homed alone (Home button)
#   enabled: False       -> axis ignored entirely (not configured, not shown)
[axis zoom]
enabled: True
home_with_all: True
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
endstop_pin: ^!gpio25
microsteps: 16
full_steps_per_rotation: 200
# Values kept from the Klipper [stepper_z] section (they look like the
# printer lead-screw defaults): recalibrate once the zoom gear is designed.
rotation_distance: 8
position_min: 0
position_max: 250
position_endstop: 0
homing_positive_dir: False
homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 2
# Klipper max_z_velocity / max_z_accel
max_velocity: 5
max_accel: 10
jog_velocity: 5
jog_accel: 10

[tmc2209 zoom]
uart_address: 1
run_current: 0.58
sense_resistor: 0.110
interpolate: True
stealthchop_threshold: 999999

# ---------------------------------------------------------------- FOCUS (E) - optional
# Klipper [extruder] driver. Set enabled: True to drive a focus ring.
[axis focus]
enabled: False
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 360
position_min: 0
position_max: 120
position_endstop: 0
max_velocity: 120
max_accel: 400
jog_velocity: 40
home_with_all: False

[tmc2209 focus]
uart_address: 3
run_current: 0.65
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

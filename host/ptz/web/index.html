<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>PTZ Control</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>PTZ</h1>
    <span id="conn" class="badge off">offline</span>
    <span id="estop-badge" class="badge danger hidden">E-STOP</span>
    <span id="rec-badge" class="badge rec hidden">● REC</span>
    <span id="play-badge" class="badge play hidden">▶ PLAY</span>
    <span id="error" class="error"></span>
    <div class="clients">
      <button id="btn-clients" class="small ghost" title="Connected devices">👥 <span id="client-count">0</span></button>
      <div id="clients-pop" class="popover hidden"></div>
    </div>
    <button id="btn-lock" class="small lock" title="Blocking mode: only you can move the head">🔒 Take control</button>
    <label class="debug-toggle"><input id="debug-mode" type="checkbox"> Debug</label>
    <button id="btn-estop" class="estop">E-STOP</button>
  </header>
  <div id="lock-banner" class="lock-banner hidden"></div>

  <main>
    <section class="card control">
      <div id="readout" class="readout"></div>
      <div id="pad" class="pad"><div id="knob" class="knob"></div></div>
      <div class="zoom">
        <label>Zoom</label>
        <input id="zoom" type="range" min="-1" max="1" step="0.01" value="0">
      </div>
      <div class="motion-settings">
        <div id="simple-sliders" class="sliders">
          <label for="speed">Speed</label>
          <input id="speed" type="range" min="0" max="1" step="any">
          <span id="speed-val" class="val"></span>
          <label for="accel">Acceleration</label>
          <input id="accel" type="range" min="0" max="1" step="any">
          <span id="accel-val" class="val"></span>
        </div>
        <table id="axis-sliders" class="axis-sliders hidden"><tbody></tbody></table>
        <div class="sliders">
          <label for="smoothing">Ease in/out</label>
          <input id="smoothing" type="range" min="0" max="1" step="0.05" value="0.3">
          <span id="smoothing-val" class="val"></span>
        </div>
        <label class="adv"><input id="advanced" type="checkbox"> Advanced: separate speed and acceleration per axis</label>
      </div>
      <p class="hint">Keyboard: arrows = pan/tilt (Shift = slow), PgUp/PgDn = zoom,
        Space = stop, Esc = E-stop. A gamepad plugged into this computer also works.</p>
    </section>

    <section class="card">
      <h2>Axes</h2>
      <table id="axes"><thead>
        <tr><th>Axis</th><th>Position</th><th>Velocity</th><th>State</th><th>Go to</th><th></th></tr>
      </thead><tbody></tbody></table>
      <div class="row buttons">
        <button id="btn-home">Home all</button>
        <button id="btn-goto">Go to</button>
        <button id="btn-stop">Stop</button>
        <button id="btn-enable">Motors on</button>
        <button id="btn-disable">Motors off</button>
      </div>
    </section>

    <section class="card">
      <h2>Presets</h2>
      <div class="row">
        <label><input id="save-mode" type="checkbox"> Save mode (click a preset to store current position)</label>
      </div>
      <div id="presets" class="presets"></div>
    </section>

    <section class="card recorder">
      <h2>Record &amp; replay</h2>
      <div class="row">
        <select id="rec-mode" title="Continuous: the whole path is recorded. Keypoints: only the points you add, replayed smoothly.">
          <option value="continuous">Continuous path</option>
          <option value="keypoints">Keypoints</option>
        </select>
        <input id="rec-name" type="text" placeholder="name (optional)">
      </div>
      <div class="row">
        <label title="The clock starts when the head starts to move, and the motionless end is trimmed">
          <input id="rec-on-move" type="checkbox" checked> Start when moving (trims idle end)</label>
      </div>
      <div class="row">
        <button id="btn-rec" class="rec-btn">● Record</button>
        <button id="btn-keypoint" disabled>+ Keypoint</button>
        <button id="btn-rec-cancel" class="hidden">Cancel</button>
      </div>
      <div id="rec-status" class="muted"></div>

      <div class="sliders replay">
        <label for="play-speed">Replay speed</label>
        <input id="play-speed" type="range" min="-3.32" max="2" step="0.01" value="0">
        <span id="play-speed-val" class="val">1.00×</span>
      </div>
      <div class="row">
        <label><input id="play-loop" type="checkbox"> Loop</label>
        <button id="btn-play-stop" disabled>■ Stop replay</button>
        <div class="progress"><div id="play-progress"></div></div>
      </div>
      <div id="play-status" class="muted"></div>
      <table id="recordings"><tbody></tbody></table>
      <div class="row">
        <button id="btn-upload" class="small">⬆ Upload a path…</button>
        <input id="upload-file" type="file" accept=".json,application/json" class="hidden">
      </div>
    </section>

    <section id="debug-card" class="card debug hidden">
      <h2>Debug console</h2>
      <div class="row">
        <select id="log-level">
          <option value="DEBUG">All messages</option>
          <option value="INFO" selected>Info and above</option>
          <option value="WARNING">Warnings and errors</option>
        </select>
        <label><input id="log-autoscroll" type="checkbox" checked> Auto-scroll</label>
        <button id="btn-log-clear">Clear</button>
        <button id="btn-diag">Run diagnostics</button>
      </div>
      <div id="console" class="console"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>

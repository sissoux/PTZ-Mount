<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PTZ Configuration</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    main.cfg { display: block; max-width: 1100px; margin: 0 auto; }
    .cfg .card { margin-bottom: 16px; }
    #editor { width: 100%; height: 62vh; min-height: 320px; resize: vertical; background: #0d0f11;
              color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 10px;
              font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; tab-size: 4;
              white-space: pre; overflow: auto; }
    #editor.dirty { border-color: var(--warn); }
    .result { margin-top: 10px; font-size: 13px; white-space: pre-wrap; }
    .result.ok { color: var(--ok); }
    .result.bad { color: var(--danger); }
    .result .warn { color: #f0b429; }
    .paths { font-size: 12px; color: var(--muted); line-height: 1.7; }
    .paths b { color: var(--text); font-weight: 600; }
    .grow { flex: 1; }
  </style>
</head>
<body>
  <header>
    <a class="btn small" href="/" style="margin-left:0">← Control</a>
    <h1>Configuration</h1>
    <span id="dirty" class="badge danger hidden">unsaved changes</span>
    <span id="error" class="error"></span>
  </header>
  <main class="cfg">
    <section class="card">
      <div id="paths" class="paths"></div>
      <div id="load-error" class="result bad hidden"></div>
    </section>
    <section class="card">
      <div class="row" style="margin-top:0">
        <button id="btn-validate">Check</button>
        <button id="btn-save">Save</button>
        <button id="btn-save-restart" class="rec-btn">Save &amp; restart</button>
        <button id="btn-revert">Discard changes</button>
        <span class="grow"></span>
        <select id="backups"><option value="">Load a backup…</option></select>
        <button id="btn-reset" title="Delete your edited copy and use the repository file again">Reset to default</button>
        <button id="btn-restart">Restart daemon</button>
      </div>
      <div id="result" class="result"></div>
      <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
      <p class="hint">Changes apply after a restart of the daemon: the board is reconfigured,
        every axis must be homed again and the motors are re-energized within a few ms.
        The file is checked before saving; the previous version is kept as a backup.</p>
    </section>
  </main>
  <script src="/static/settings.js"></script>
</body>
</html>
